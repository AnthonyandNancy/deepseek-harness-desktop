name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# Compatibility gate for DeepSeek Harness upgrades: an upstream release that
# breaks Electron hosting, the Windows launcher, node-pty, the ACL sandbox, or
# the packaged Web UI must fail here rather than reach main.
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist:linux
      - run: npm run smoke:packaged

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run prepare:windows
      - run: npm test
        # Also covers the real PTY write/read round trip and the ACL sandbox.
      - run: npm run test:win-console
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: npm run smoke:packaged

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            script: dist:mac:arm64
          - runner: macos-15-intel
            script: dist:mac:x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: npm run smoke:packaged
